<head>

const _mb=new Blob([JSON.stringify(_m)],{type:'application/json'});
const _ml=document.createElement('link');_ml.rel='manifest';_ml.href=URL.createObjectURL(_mb);document.currentScript.after(_ml);
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap');
:root{
  --bg:#0a0b10;--s1:#11131b;--s2:#171a25;--s3:#1f2330;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#eef1f7;--muted:#9aa3b8;--faint:#5a627a;
  --gold:#ffd24a;--green:#6fe28b;--red:#ff6b6b;--teal:#5bd9d0;--orange:#ff9966;
  --VIGOR:#ff6b6b;--MIND:#5bd9d0;--WILL:#a78bfa;--AURA:#f472b6;--GOLD:#f3c55a;
  --px:'Press Start 2P',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse at 50% -10%,#1a2036 0%,#0a0b10 55%) fixed,var(--bg)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);z-index:0}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.px{font-family:var(--px);letter-spacing:.5px}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:14px 14px calc(104px + env(safe-area-inset-bottom))}
.app.nopad{padding-bottom:28px}

/* кнопки и панели */
.btn{display:block;width:100%;padding:15px 14px;border:2px solid #000;border-radius:6px;background:var(--gold);color:#17120a;font-family:var(--px);font-size:11px;line-height:1.4;text-align:center;box-shadow:0 4px 0 #a37a00;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a37a00}
.btn:disabled{opacity:.55;pointer-events:none}
.btn.ghost{background:var(--s2);color:var(--text);box-shadow:0 4px 0 #05060a;border-color:#000;outline:1px solid var(--line2);outline-offset:-3px}
.btn.ghost:active{box-shadow:0 1px 0 #05060a}
.btn.sm{padding:11px 10px;font-size:9px}
.btn.green{background:var(--green);box-shadow:0 4px 0 #2c8a45}
.panel{background:var(--s1);border:2px solid #000;border-radius:8px;box-shadow:0 0 0 2px var(--line),0 6px 0 #05060a;padding:14px;margin-bottom:16px}
.h-sec{font-family:var(--px);font-size:10px;color:var(--muted);letter-spacing:1px;margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h-sec span{font-family:'Inter';font-size:11px;color:var(--faint);letter-spacing:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-left:8px;vertical-align:middle}
.sync-dot.ok{background:var(--green)}.sync-dot.syncing{background:var(--gold);animation:pulse .8s infinite}.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* верхняя панель */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-family:var(--px);font-size:13px;letter-spacing:1px}
.brand b{color:var(--gold)}
.ico{width:38px;height:38px;border-radius:6px;background:var(--s2);border:2px solid #000;outline:1px solid var(--line2);outline-offset:-3px;display:flex;align-items:center;justify-content:center;font-size:16px}

/* вход / сплэш */
.screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 6px 40px;text-align:center}
.tag{font-family:var(--px);font-size:9px;color:var(--teal);letter-spacing:1.5px;margin-bottom:18px}
.logo{font-family:var(--px);font-size:34px;line-height:1.15;color:var(--text);text-shadow:3px 0 var(--AURA),-3px 0 var(--teal);margin-bottom:6px}
.logo.sm{font-size:22px}
.lead{font-size:14px;line-height:1.65;color:var(--muted);margin:18px auto 26px;max-width:340px}
.lead b{color:var(--text);font-weight:600}
.cast{display:flex;justify-content:center;align-items:flex-end;margin:6px 0 4px}
.cast canvas{width:100px;height:auto;margin:0 -8px}
.cast canvas:nth-child(2){margin-bottom:0;z-index:2}
.foot-note{font-size:12px;color:var(--faint);margin-top:18px}
.inp{width:100%;padding:13px 14px;border-radius:6px;background:#0b0d14;border:2px solid #000;outline:1px solid var(--line2);outline-offset:-3px;color:var(--text);font-size:16px}
.inp:focus{outline-color:var(--gold)}
.err{min-height:18px;font-size:12px;color:var(--red);margin:8px 2px}
.act-input{text-align:center;letter-spacing:2px;font-weight:700}
.link{color:var(--teal);font-size:13px;text-decoration:none;display:inline-block;margin-top:16px}

/* создание героя */
.cr-prev{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 16px}
.cr-stage{width:190px;height:216px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at 50% 90%,#2a3050 0%,transparent 70%),var(--s1);border:2px solid #000;border-radius:8px;box-shadow:0 0 0 2px var(--line);padding-bottom:14px;position:relative}
.cr-stage canvas{width:150px;height:auto}
.cr-stage::after{content:'';position:absolute;bottom:10px;left:50%;width:110px;height:10px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%)}
.cr-sec{margin-bottom:14px}
.cr-h{font-family:var(--px);font-size:9px;color:var(--muted);letter-spacing:1px;margin:0 2px 8px}
.cr-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.cr-row::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;min-width:64px;padding:6px;border-radius:6px;background:var(--s2);border:2px solid #000;outline:1px solid var(--line);outline-offset:-3px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.tile.sel{outline:2px solid var(--gold);color:var(--gold);background:#1c1a14}
.tile canvas{width:100px;height:auto}
.tile canvas[data-crop=face]{width:60px}
.tile.lock canvas{filter:grayscale(1) brightness(.5)}
.tile.lock{color:var(--faint)}
.tile .sk-n{font-family:var(--px);font-size:8px}
.tile .sk-e{font-size:9px;color:var(--muted)}
.skin-note{font-size:11px;color:var(--faint);line-height:1.5;margin:-2px 2px 8px}
.ed{font-family:var(--px);font-size:6px;margin-left:4px}
.tile canvas[data-crop=top]{width:92px}
.tile canvas[data-crop=legs]{width:76px}
.sw{flex:0 0 auto;width:36px;height:36px;border-radius:6px;border:2px solid #000;outline:1px solid var(--line2);outline-offset:-3px}
.sw.sel{outline:3px solid var(--gold)}
.cr-sticky{position:sticky;top:0;z-index:8;margin:0 -14px 12px;padding:6px 14px 8px;background:linear-gradient(180deg,#0a0b10 82%,rgba(10,11,16,0))}
.cr-sticky .cr-stage{margin:0 auto 10px}
.dice-btn{position:absolute;right:6px;top:6px;font-family:var(--px);font-size:7px;padding:7px 6px;border-radius:4px;background:var(--s3);border:2px solid #000;color:var(--text)}
.cr-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cr-tab{padding:10px 1px;border-radius:5px;background:var(--s2);border:2px solid #000;outline:1px solid var(--line);outline-offset:-3px;font-family:var(--px);font-size:7px;color:var(--muted)}
.cr-tab.on{color:var(--gold);outline:2px solid var(--gold);background:#1c1a14}
.cr-pane[hidden]{display:none}
.cr-gender{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 auto 8px;max-width:300px}
.cr-g{padding:11px 4px;border-radius:5px;background:var(--s2);border:2px solid #000;outline:1px solid var(--line);outline-offset:-3px;font-family:var(--px);font-size:8px;color:var(--muted)}
.cr-g.on{color:var(--gold);outline:2px solid var(--gold);background:#1c1a14}
.dot{width:9px;height:9px;border-radius:50%;background:var(--s3);border:2px solid #000;justify-self:center}
.dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.rl{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:14px 0 10px}
.rl-i{display:flex;flex-direction:column;gap:3px;padding:8px 9px;border-radius:4px;background:var(--s3);border:2px solid #000;color:var(--faint)}
.rl-i b{font-family:var(--px);font-size:8px;font-weight:400;letter-spacing:.5px}
.rl-i span{font-size:10px}
.rl-i.on{border-left:4px solid var(--rc);color:var(--text)}
.rl-i.on b{color:var(--rc)}
.rl-i.cur{outline:2px solid var(--gold);outline-offset:-3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dice{width:100%}

/* выбор сезона / босса */
.card-pick{display:block;width:100%;text-align:left;padding:14px;margin-bottom:12px;border-radius:8px;background:var(--s1);border:2px solid #000;box-shadow:0 0 0 2px var(--line),0 4px 0 #05060a}
.card-pick:active{transform:translateY(2px)}
.card-pick .t{font-family:var(--px);font-size:11px;line-height:1.5;display:flex;justify-content:space-between;gap:8px}
.card-pick .t em{font-style:normal;color:var(--gold)}
.card-pick .d{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.note-sm{font-size:11px;color:var(--faint);line-height:1.5;margin-top:14px;text-align:center}

/* домашний экран */
.me-strip{display:flex;align-items:center;gap:12px}
.me-strip canvas{width:64px;height:auto;flex:0 0 auto;background:var(--s2);border:2px solid #000;border-radius:6px}
.me-name{font-family:var(--px);font-size:12px;line-height:1.4;word-break:break-all}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:var(--px);font-size:8px;padding:6px 7px;border-radius:4px;border:2px solid #000;background:var(--s3);color:var(--text);line-height:1}
.chip.rank{color:var(--rc,#fff)}
.chip.fire{color:var(--orange)}
.bar{height:12px;border-radius:3px;background:#07080c;border:2px solid #000;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c,var(--gold)),var(--c2,#fff3b0));image-rendering:pixelated;transition:width .5s steps(12)}
.bar-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.day-sum{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.day-sum .big{font-family:var(--px);font-size:16px;color:var(--gold)}
.day-sum .sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}

/* квесты */
.q{--c:#ffd24a;position:relative;padding:13px 13px 13px 15px;margin-bottom:10px;border-radius:8px;background:var(--s1);border:2px solid #000;box-shadow:0 0 0 2px var(--line),0 4px 0 #05060a;overflow:hidden}
.q::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.q.done{opacity:.55}
.q.hl{box-shadow:0 0 0 2px var(--gold),0 4px 0 #05060a}
.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.q-stat{display:flex;align-items:center;gap:7px;font-family:var(--px);font-size:9px;color:var(--c)}
.q-xp{font-family:var(--px);font-size:11px;color:var(--gold)}
.q-title{font-size:15px;font-weight:700;line-height:1.3}
.q-descr{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.q-act{margin-top:12px}.q-act:empty{display:none}
.q-ok{font-family:var(--px);font-size:9px;color:var(--green)}
.q.boss{background:linear-gradient(135deg,#241c10,var(--s1));}
.q-boss{font-family:var(--px);font-size:8px;color:var(--orange);margin-bottom:8px;letter-spacing:.5px}
.enemy{border-left:5px solid var(--red)}
.enemy .e-t{font-family:var(--px);font-size:10px;color:var(--red);margin-bottom:8px;line-height:1.5}
.enemy .e-q{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:12px;line-height:1.5}
.pop{position:fixed;z-index:80;font-family:var(--px);font-size:12px;color:var(--gold);pointer-events:none;text-shadow:2px 2px 0 #000;animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}

/* герой */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 10px 6px}
.stage .plat{position:relative;width:250px;height:290px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at 50% 92%,#2a3050 0%,transparent 68%);padding-bottom:12px}
.stage canvas{width:200px;height:auto}
.stage .nm{font-family:var(--px);font-size:14px}
.hs{display:grid;grid-template-columns:48% 1fr;gap:10px;align-items:stretch;padding:10px}
.hs-l{display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at 50% 94%,#2a3050 0%,transparent 70%)}
.hs-l .plat{width:100%;display:flex;justify-content:center;align-items:flex-end}
.hs-l canvas{width:100%;height:auto}
.hs-r{display:flex;flex-direction:column;gap:9px;min-width:0;justify-content:center}
.hs-r .nm{font-family:var(--px);font-size:12px;overflow-wrap:anywhere}
.hs-xp{font-family:var(--px);font-size:9px;color:var(--faint)}
.hs-st{--c:#fff}
.hs-h i{font-style:normal;font-family:'Inter';font-size:10px;color:var(--faint)}
.hs-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--px);font-size:8px;color:var(--c);margin-bottom:5px}
.hs-h span{display:flex;gap:6px;align-items:center}
.hs-h b{font-weight:400;color:var(--text,#e8ebf5)}
html{--tg-top:0px}
.topbar{padding-top:var(--tg-top)}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:14px 0 10px}
.ladder div{font-family:var(--px);font-size:6px;text-align:center;padding:8px 0;border-radius:3px;background:var(--s3);border:2px solid #000;color:var(--faint);line-height:1.3}
.ladder div.on{color:#111;background:var(--rc)}
.ladder div.cur{outline:2px solid var(--gold)}
.stat-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;margin-bottom:12px}
.stat-row .nm{font-family:var(--px);font-size:9px;color:var(--c);margin-bottom:6px}
.stat-row .v{font-family:var(--px);font-size:10px;text-align:right;line-height:1.5}
.stat-row .v small{display:block;font-family:'Inter';font-size:10px;color:var(--faint)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv .c{padding:12px;border-radius:6px;background:var(--s2);border:2px solid #000;outline:1px solid var(--line);outline-offset:-3px}
.kv .c .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.kv .c .n{font-family:var(--px);font-size:14px}
.kv .c .s{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}

/* лобби */
.bd-row{display:grid;grid-template-columns:22px 64px 1fr auto auto;gap:9px;align-items:center;padding:9px 8px;border-radius:6px;margin-bottom:6px;background:var(--s2);border:2px solid #000}
.bd-row.me{outline:2px solid var(--gold);background:#1c1a14}
.bd-pos{font-family:var(--px);font-size:9px;color:var(--muted);text-align:center}
.bd-row canvas{width:64px;height:auto}
.bd-nick{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-rank{font-family:var(--px);font-size:7px;color:var(--rc,#9aa3b8)}
.bd-days{font-family:var(--px);font-size:10px;color:var(--teal)}
.empty{font-size:13px;color:var(--muted);line-height:1.6;text-align:center;padding:14px 6px}

/* нижняя навигация */
.tabbar{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
.tabbar-in{pointer-events:auto;width:100%;max-width:460px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#0a0b10 70%,rgba(10,11,16,0))}
.tab{padding:11px 4px;border-radius:6px;background:var(--s2);border:2px solid #000;outline:1px solid var(--line);outline-offset:-3px;font-family:var(--px);font-size:8px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:7px}
.tab.on{color:var(--gold);outline:2px solid var(--gold);background:#1c1a14}

/* модалка, тосты */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,6,10,.82)}
.modal.show{display:flex}
.modal-box{width:100%;max-width:340px;text-align:center}
.modal-box .px{line-height:1.6}
.toast{position:fixed;z-index:70;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#0f1320;border:2px solid #000;outline:1px solid var(--line2);outline-offset:-3px;padding:11px 16px;border-radius:6px;font-size:13px;font-weight:600;max-width:90vw;text-align:center;transition:all .22s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.logo{font-size:28px}.ladder div{font-size:5px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
